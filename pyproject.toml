[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "grokhr_shared"
version = "1.0.0"
description = "Shared Employee contracts for the GrokHR demo."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "email-validator>=2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "jsonschema>=4.21",
]

[tool.hatch.build.targets.wheel]
packages = ["grokhr_shared"]

[tool.hatch.build.targets.wheel.force-include]
"schemas/employee.schema.json" = "grokhr_shared/schemas/employee.schema.json"

[tool.hatch.build.targets.sdist]
include = [
  "grokhr_shared",
  "schemas/employee.schema.json",
  "fixtures/employee.example.json",
  "fixtures/department.example.json",
  "README.md",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
